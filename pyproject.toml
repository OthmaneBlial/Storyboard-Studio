[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "storyboard-studio"
version = "0.2.0"
description = "A local-first studio for creating concise, editable PowerPoint presentations."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Storyboard Studio contributors" }]
dependencies = [
  "CairoSVG>=2.7,<3",
  "fastapi>=0.115,<1",
  "google-genai>=1.0,<2",
  "python-pptx>=1.0,<2",
  "tomli>=2.0,<3; python_version < '3.11'",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
storyboard = "storyboard_studio.cli:main"
storyboard-studio = "storyboard_studio.cli:main"

[project.optional-dependencies]
dev = [
  "httpx2>=2.12,<3",
  "build>=1.2,<2",
  "Pillow>=11,<13",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]
browser = [
  "playwright>=1.62,<2",
]

[tool.setuptools]
py-modules = ["ai_helper", "generate_pptx", "outline_markdown", "schemas", "server"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["storyboard_studio*"]

[tool.setuptools.package-data]
storyboard_studio = ["data/*.json", "web/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 110
extend-exclude = ["output"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
