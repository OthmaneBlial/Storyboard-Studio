name: Reviewed story artifact

on:
  pull_request:
    branches: [main]
    paths:
      - "**.story.json"
      - "**.story.md"
      - "examples/**/*.json"
      - "outline_markdown.py"
      - "storyboard_studio/**"
      - "schemas.py"
      - ".github/actions/review-story/**"
      - ".github/workflows/review-story.yml"
  workflow_dispatch:
    inputs:
      story_path:
        description: Repository-relative reviewed story JSON or Markdown
        required: true
        default: storyboard_studio/data/decision-brief.story.json
        type: string
  workflow_call:
    inputs:
      story_path:
        description: Repository-relative reviewed story JSON or Markdown
        required: false
        default: storyboard_studio/data/decision-brief.story.json
        type: string

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the reviewed renderer
        run: python -m pip install .
      - name: Build the offline review artifact
        uses: ./.github/actions/review-story
        with:
          story-path: ${{ inputs.story_path || 'storyboard_studio/data/decision-brief.story.json' }}
          output-dir: storyboard-review
      - name: Upload the reviewable story artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: storyboard-reviewed-story
          path: storyboard-review/*
          if-no-files-found: error
