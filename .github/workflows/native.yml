name: Native preview artifacts

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-14
            platform: macos
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the native build extra
        run: python -m pip install -e ".[native]"
      - name: Build and smoke-test the native executable
        run: python scripts/build_native.py --output-dir native-output
      - name: Upload the native preview and evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: storyboard-native-${{ matrix.platform }}-${{ runner.arch }}
          path: |
            native-output/storyboard-studio*
            native-output/native-build.json
          if-no-files-found: error
          retention-days: 5
