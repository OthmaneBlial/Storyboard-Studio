name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and checks
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Test
        run: python -m pytest
      - name: Render the runnable example
        run: python generate_pptx.py --input examples/product-brief.json --output output/ci-example.pptx
      - name: Keep the generated artifact for review
        uses: actions/upload-artifact@v4
        with:
          name: storyboard-example-pptx
          path: output/ci-example.pptx
          if-no-files-found: error
