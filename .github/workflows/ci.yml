name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Set up the documented development environment
        run: make setup
      - name: Verify the documented development workflow
        run: |
          make lint
          make format-check
          make test
      - name: Build a distributable wheel
        run: .venv/bin/python -m pip wheel --no-deps --wheel-dir /tmp/storyboard-wheel .
      - name: Render the runnable example
        run: make export-sample
      - name: Keep the generated artifact for review
        uses: actions/upload-artifact@v4
        with:
          name: storyboard-example-pptx
          path: output/product-brief.pptx
          if-no-files-found: error
