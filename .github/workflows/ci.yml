name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      visual:
        description: "Run LibreOffice visual QA (manual, release-candidate path)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Set up the documented development environment
        run: make setup
      - name: Verify the documented development workflow
        run: |
          make lint
          make format-check
          make test
      - name: Build a distributable wheel
        run: .venv/bin/python -m pip wheel --no-deps --wheel-dir /tmp/storyboard-wheel .
      - name: Render the runnable example
        run: make export-sample
      - name: Keep the generated artifact for review
        uses: actions/upload-artifact@v7
        with:
          name: storyboard-example-pptx-py${{ matrix.python-version }}
          path: output/product-brief.pptx
          if-no-files-found: error

  package:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build source and wheel artifacts
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/storyboard-clean
          /tmp/storyboard-clean/bin/python -m pip install dist/*.whl
          /tmp/storyboard-clean/bin/python generate_pptx.py --input examples/product-brief.json --output /tmp/storyboard-clean-example.pptx
          test -s /tmp/storyboard-clean-example.pptx
      - name: Upload release candidates
        uses: actions/upload-artifact@v7
        with:
          name: storyboard-distributions
          path: dist/*
          if-no-files-found: error

  visual:
    if: github.event_name == 'workflow_dispatch' && inputs.visual == true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the reviewed viewer and image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-impress poppler-utils
          soffice --version
      - name: Install QA dependencies
        run: python -m pip install --upgrade pip Pillow
      - name: Render approved fixture
        run: python scripts/render_slides.py docs/fixtures/product-brief.pptx --output rendered-slides --require
      - name: Compare title-slide reference
        run: python scripts/compare_visual.py docs/assets/storyboard-sample.png rendered-slides/product-brief-1.png --tolerance 12
      - name: Upload visual evidence
        uses: actions/upload-artifact@v7
        with:
          name: storyboard-visual-render
          path: rendered-slides/*
