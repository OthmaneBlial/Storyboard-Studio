name: Release artifacts

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build and verify distributions
        run: |
          python -m pip install --upgrade build
          python -m build
          python -m venv /tmp/storyboard-clean
          /tmp/storyboard-clean/bin/python -m pip install dist/*.whl
          /tmp/storyboard-clean/bin/python generate_pptx.py --input examples/product-brief.json --output /tmp/storyboard-release.pptx
          test -s /tmp/storyboard-release.pptx
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag
