name: Bug report
description: Help us reproduce a problem in the studio or PPTX export.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please remove API keys and private presentation content before posting."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Include the expected behavior and actual result.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Safe reproduction steps
      placeholder: "1. Start the server…\n2. Enter…\n3. Export…"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: dropdown
    id: surface
    attributes:
      label: Where did it happen?
      options: [Browser studio, API, PPTX export, CLI, Docker, Documentation]
