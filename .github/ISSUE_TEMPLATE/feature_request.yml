name: Feature request
description: Suggest a focused improvement to the local-first deck workflow.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What presentation-making problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
