<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Storyboard Studio theme gallery</title>
  <desc id="desc">Six 16 by 9 theme cards: Midnight, Glacier, Ember, Forest, Royal, and Sakura.</desc>
  <rect width="1200" height="420" fill="#f6f3eb"/>
  <g font-family="Arial, sans-serif" font-size="18" font-weight="700">
    <g transform="translate(30 30)"><rect width="350" height="160" rx="8" fill="#101425"/><rect x="24" y="26" width="6" height="108" fill="#e5b560"/><text x="54" y="62" fill="#e5b560">MIDNIGHT</text><text x="54" y="99" fill="#f7f4ee" font-size="27">Editorial focus</text><text x="54" y="128" fill="#b8c0d6" font-size="13">Dark · decisive · high contrast</text></g>
    <g transform="translate(425 30)"><rect width="350" height="160" rx="8" fill="#f4f8f8" stroke="#d4e5e7"/><rect x="24" y="26" width="6" height="108" fill="#0a7c86"/><text x="54" y="62" fill="#0a7c86">GLACIER</text><text x="54" y="99" fill="#123544" font-size="27">Field notes</text><text x="54" y="128" fill="#55727a" font-size="13">Light · calm · analytical</text></g>
    <g transform="translate(820 30)"><rect width="350" height="160" rx="8" fill="#25120f"/><rect x="24" y="26" width="6" height="108" fill="#f08a4b"/><text x="54" y="62" fill="#f08a4b">EMBER</text><text x="54" y="99" fill="#fff5e7" font-size="27">Study in motion</text><text x="54" y="128" fill="#d6b9a8" font-size="13">Warm · urgent · expressive</text></g>
    <g transform="translate(30 230)"><rect width="350" height="160" rx="8" fill="#f1f5ee" stroke="#d0dfc9"/><rect x="24" y="26" width="6" height="108" fill="#438360"/><text x="54" y="62" fill="#438360">FOREST</text><text x="54" y="99" fill="#1d3829" font-size="27">Fieldwork</text><text x="54" y="128" fill="#577060" font-size="13">Grounded · practical · humane</text></g>
    <g transform="translate(425 230)"><rect width="350" height="160" rx="8" fill="#17151b"/><rect x="24" y="26" width="6" height="108" fill="#c79c54"/><text x="54" y="62" fill="#c79c54">ROYAL</text><text x="54" y="99" fill="#f5ecd8" font-size="27">Archive</text><text x="54" y="128" fill="#c7b99a" font-size="13">Dark · composed · premium</text></g>
    <g transform="translate(820 230)"><rect width="350" height="160" rx="8" fill="#fcf4f4" stroke="#f0d5da"/><rect x="24" y="26" width="6" height="108" fill="#be526d"/><text x="54" y="62" fill="#be526d">SAKURA</text><text x="54" y="99" fill="#4d2736" font-size="27">Notebook</text><text x="54" y="128" fill="#846274" font-size="13">Soft · editorial · personal</text></g>
