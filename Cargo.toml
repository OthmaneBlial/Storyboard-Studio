[workspace]
members = ["crates/storyboard-core", "crates/storyboard-pptx"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/OthmaneBlial/Storyboard-Studio"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
schemars = "1"
zip = { version = "6", default-features = false, features = ["deflate"] }
quick-xml = "0.38"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
